name: diag-fin (임시)
on:
  push:
    branches: [ccr-f5563461-oo41yi]
    paths: [scripts/fin-score.py, .github/workflows/diag-fin.yml]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==1.7.0 pandas==3.0.6 numpy==2.4.6
      - run: |
          python3 scripts/fin-score.py --selftest
          python3 scripts/fin-score.py --tickers all
          python3 -c "
          import json;d=json.load(open('data/technical/fin.json'))
          for c,it in d['items'].items():
              f,m=it['fundamental'],it['moat']
              print(c, it['financial'], 'F', f['met'],f['total'],f['unknown'],f['as_of'], 'M', m['met'],m['total'],m['unknown'],m['as_of'])
          print('failed', d['failed'])"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/technical/fin.json && git commit -m "재무 달 점수 첫 계산(fin-score, 임시 진단 실행)" && git push origin HEAD:${GITHUB_REF_NAME}
