# 종목 특성(가격 행동 통계, 코드 계산) 갱신 — 사용자 요청(2026-10-06): "상한가 자주 발생, 상승 후 반전, 상승 지속형 등".
# scripts/stock-profiles.py가 yfinance 2년 일봉으로 data/technical/profiles.json을 만든다. LLM·Secret 불필요.
# 검증 통과 시 실행한 브랜치(예약·수동 = main)에 바로 커밋한다(시황 자동수집과 같은 정책).
name: stock-profiles
on:
  schedule:
    - cron: "20 0 * * 6" # 토요일 09:20 KST — 금요일 미장까지 끝난 뒤 주 1회(정각 회피)
  workflow_dispatch:
    inputs:
      tickers:
        description: "종목코드/티커 쉼표 구분, 또는 all"
        default: "all"
        type: string
permissions:
  contents: write
concurrency:
  group: stock-profiles
  cancel-in-progress: false
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance==1.7.0 pandas==3.0.6 numpy==2.4.6
      - name: 종목 특성 계산 (코드)
        run: |
          python3 scripts/technical-indicators.py --selftest
          python3 scripts/stock-profiles.py --selftest
          python3 scripts/stock-profiles.py --tickers "${{ inputs.tickers || 'all' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 검증
        run: npm run check
      - name: 커밋 (검증 통과 시, 실행한 브랜치에 바로)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/technical/profiles.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "종목 특성 갱신 (stock-profiles)"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "반영 완료"; exit 0; fi
            sleep 5
          done
          echo "푸시 실패"; exit 1
