name: Collect market data

on:
  schedule:
    # 평일 11:20 / 12:20 / 13:20 UTC = 20:20 / 21:20 / 22:20 KST — 하루 3회 시도.
    # 네이버 AI 브리핑(코스피 투자자 수급 포함)은 20:01 KST쯤 올라오고, 다음 날 새벽 실행에서는 수급이 빠져 실패했다(#80).
    # GitHub는 정각 예약을 지연·누락시키는 일이 잦다(2026-09: 07시·10시 UTC 정각 예약이 3주간 거의 돌지 않았고 12시도 0~3시간 지연)
    # → 정각을 피한다. 이미 수집된 날이면 스크립트가 changed=false로 바로 끝나므로 3회 모두 돌아도 무해하다.
    - cron: "20 11,12,13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "커밋 없이 수집 결과만 확인"
        default: false
        type: boolean
      backfill_us:
        description: "과거 항목의 미장 값을 이력으로 다시 채움(1회용, scripts/backfill-us-indices.mjs)"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: collect-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect closing market data
        id: collect
        run: npm run collect:market${{ inputs.dry_run == true && ':dry-run' || '' }}

      - name: Backfill US indices (수동 옵션)
        if: inputs.backfill_us == true
        run: node scripts/backfill-us-indices.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Validate generated data
        if: inputs.dry_run != true
        run: npm run check

      # 2026-10-05 변경: PR + 자동머지(gh pr merge --auto)는 저장소의 "Allow auto-merge" 설정에 의존해 9/29부터 멈췄다(#80).
      # 브랜치 보호가 없고 위에서 검증을 마쳤으므로, 실행한 브랜치(예약·버튼 = main)에 바로 커밋한다. 사용자 결정.
      - name: Commit (검증 통과 시 바로 반영)
        if: inputs.dry_run != true
        env:
          KR_DATE: ${{ steps.collect.outputs.kr_date }}
          CHANGED: ${{ steps.collect.outputs.changed }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/index.json
          if git diff --cached --quiet; then echo "변경 없음 (${KR_DATE} 이미 반영됨)"; exit 0; fi
          if [ "$CHANGED" = "true" ]; then MSG="Update market data for ${KR_DATE}"; else MSG="Backfill US indices from history"; fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "반영 완료: $MSG"; exit 0; fi
            sleep 5
          done
          echo "푸시 실패"; exit 1
