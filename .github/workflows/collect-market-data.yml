name: Collect market data

on:
  schedule:
    # 월~금 07:00 / 10:00 / 12:00 UTC = 16시 / 19시 / 21시 KST — 하루 3회 시도한다.
    #
    # 코스피 투자자 수급(investor_flow_combined_bar)이 실린 브리핑을 못 찾으면 수집이
    # 실패하는데(#80), 실패는 전부 01시·08시 KST대 실행에서 났고 성공은 전부
    # 16~22시 KST대에서 났다. 그런데 GitHub 스케줄은 최대 4시간 넘게 밀리기도 해서
    # (run #52는 12:00 UTC 예정이 16:22 UTC에 실행되어 01시 KST로 넘어가 실패)
    # 단일 스케줄로는 그 시간대 안에 안착시킬 수 없다.
    #
    # 그래서 성공 구간 앞쪽부터 3회를 깔아 지연이 나도 최소 한 번은 구간 안에 들어오게 한다.
    # 이미 수집된 날짜면 스크립트가 changed=false로 끝내고, 열린 PR이 있으면 PR 생성
    # 단계도 조기 종료하므로 중복 실행은 무해하다.
    - cron: "0 7,10,12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect closing market data
        id: collect
        run: npm run collect:market

      - name: Validate generated data
        if: steps.collect.outputs.changed == 'true'
        run: npm run check

      - name: Create daily pull request
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KR_DATE: ${{ steps.collect.outputs.kr_date }}
          US_DATE: ${{ steps.collect.outputs.us_date }}
          WTI_DATE: ${{ steps.collect.outputs.wti_date }}
          BRIEFING_TITLE: ${{ steps.collect.outputs.briefing_title }}
        shell: bash
        run: |
          BRANCH="automation/market-data-${KR_DATE}"
          EXISTING_URL="$(gh pr list --state open --head "$BRANCH" --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING_URL" ]; then
            echo "이미 열린 PR이 있습니다: $EXISTING_URL"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/market/index.json
          git commit -m "Update market data for ${KR_DATE}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          else
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

          BODY="$(printf '%s\n' \
            '## 자동 수집 결과' \
            "- 국장 기준일: ${KR_DATE}" \
            "- 미장 기준일: ${US_DATE}" \
            "- WTI 기준일: ${WTI_DATE}" \
            "- AI 브리핑: ${BRIEFING_TITLE}" \
            '' \
            '## 자동 검증' \
            '- 8개 지표, 코스피 투자자 수급, 날짜 및 출처 검증 통과' \
            '- 코멘트·키워드 출처: 네이버페이 증권 AI 브리핑')"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "시황 데이터 ${KR_DATE} 자동 반영" \
            --body "$BODY"

          # 시황 자동수집 PR에 한해서만 자동 머지를 허용한다(사용자 승인 범위).
          # 다른 워크플로우/PR에는 이 패턴을 적용하지 않는다. 이미 npm run check로
          # 데이터를 검증했고, 브랜치 보호에 필수 체크가 걸려있으면 그 체크들이
          # 통과된 뒤에 머지된다. 저장소에서 "Allow auto-merge"가 꺼져있으면 이
          # 명령은 실패하는데, PR 자체는 이미 만들어졌으니 그 이유로 잡 전체를
          # 실패 처리하지 않는다 — 대신 로그에 남겨서 설정을 켜야 한다는 걸 알 수 있게 한다.
          gh pr merge "$BRANCH" --auto --merge \
            || echo "::warning::자동 머지 실패 — 저장소 Settings > General > Pull Requests에서 'Allow auto-merge'를 켜야 합니다. PR은 정상 생성됐습니다."
