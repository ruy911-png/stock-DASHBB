name: Apply 4-section SEPA study note

on:
  push:
    branches:
      - "chatgpt/shorten-sepa-study-note"
    paths:
      - ".github/workflows/apply-sepa-study-note-4section.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/shorten-sepa-study-note
          fetch-depth: 0

      - name: Replace SEPA note with 4-section version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('src/dashboard.template.html')
          text = path.read_text(encoding='utf-8')
          needle = "      { cat: '매매원칙', catCol: '#1E8E5A', catBg: '#E7F6EE', title: 'SEPA 기반 종목추천 방법론', body:"
          start = text.find(needle)
          if start < 0:
              raise SystemExit('SEPA study note not found')
          next_note = text.find("\n      { cat:", start + len(needle))
          if next_note < 0:
              raise SystemExit('next study note boundary not found')
          replacement = base64.b64decode('').decode('utf-8')
          text = text[:start] + replacement + text[next_note:]
          old_key = 'stockking_study_upload_20260904_v4'
          new_key = 'stockking_study_upload_20260904_v5'
          if old_key not in text:
              raise SystemExit('study cache version key not found')
          text = text.replace(old_key, new_key, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and verify dashboard
        run: |
          npm run build
          npm run check

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-sepa-study-note-4section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard.template.html index.html .github/workflows/apply-sepa-study-note-4section.yml
          git commit -m "docs: regroup SEPA methodology into four sections"
          git push origin HEAD:chatgpt/shorten-sepa-study-note
